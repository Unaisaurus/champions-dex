name: Publish the app

# Builds the app and publishes it with GitHub Pages, at
#   https://<your-username>.github.io/<repository-name>/
# so it works on your phone and computer without installing anything.
#
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
# GitHub's free plan only publishes public repositories; while the repository
# is private this workflow simply does nothing.
on:
  push:
    branches: [main]
  # Also started by "Update game data" once it has saved new data (pushes made by
  # a workflow don't start other workflows), and by "Run workflow" on the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The newest version, including any data a data update has just saved.
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
