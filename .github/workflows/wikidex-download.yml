name: Download WikiDex pages (work branch)

# Temporary, on the wikidex-import branch only: downloads the WikiDex pages
# and saves them to this branch, so the importer can be built against them.
on:
  push:
    branches: [wikidex-import]
    paths: [scripts/wikidex/**, .github/workflows/wikidex-download.yml]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Download the pages
        run: npx tsx scripts/wikidex/download.ts

      - name: Save them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/sources/wikidex/pages.json
          git commit -m "WikiDex pages downloaded $(date -u +%F)" || exit 0
          git push
